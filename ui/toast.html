<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>imini 控制中心</title>
<style>
:root{--bg:#fff;--border:#d6dee7;--text:#18222e;--muted:#5c6a7a;--accent:#0c8a6c;--shadow:0 12px 34px rgba(20,32,48,.22)}
@media (prefers-color-scheme:dark){:root{--bg:#101720;--border:#253244;--text:#e9f0f7;--muted:#91a1b3;--accent:#37d6a8;--shadow:0 12px 34px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}
body{font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
.toast{position:absolute;inset:6px;display:flex;align-items:center;gap:13px;padding:0 18px;border:1px solid var(--border);border-radius:14px;background:var(--bg);box-shadow:var(--shadow);color:var(--text);animation:in .16s ease-out both}
.mark{width:30px;height:30px;flex:none;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center}
.mark svg{width:17px;height:17px;display:block}
.body{min-width:0;line-height:1.25}
.title{font-size:11px;letter-spacing:.02em;color:var(--muted)}
.message{font-size:14px;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="toast">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  </div>
  <div class="body">
    <div class="title">imini 控制中心</div>
    <div class="message" id="message">已切换到“静音模式”</div>
  </div>
</div>
<script>
  const names = { silent: "静音", balanced: "均衡", performance: "狂暴" };
  const mode = new URLSearchParams(location.search).get("mode") || "silent";
  document.getElementById("message").textContent = "已切换到“" + (names[mode] || "静音") + "模式”";
</script>
</body>
</html>
