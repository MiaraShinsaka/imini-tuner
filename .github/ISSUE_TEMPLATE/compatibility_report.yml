name: 兼容性报告
description: 其他机械革命机型 / BIOS 的只读检测或实测报告
title: "[Compatibility] "
body:
  - type: markdown
    attributes:
      value: |
        请先只读检测，不要直接写入模式。不同模具的 `PowerSwitchInterface` 可能同名但模式值、风扇通道不同。
        如果你已经写入并出现异常，请先切回原模式、断电，并在描述中说明。

  - type: input
    id: model
    attributes:
      label: 机型
      placeholder: MECHREVO ...
    validations:
      required: true

  - type: input
    id: board
    attributes:
      label: 主板型号
      placeholder: IMINI-...
    validations:
      required: true

  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: AMD Ryzen ...
    validations:
      required: true

  - type: input
    id: bios
    attributes:
      label: BIOS 版本
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: --status 输出（脱敏）
      description: 管理员运行 `"%LOCALAPPDATA%\iminiControlCenter\imini-power-210.exe" --status` 后贴 JSON
      render: json
    validations:
      required: true

  - type: dropdown
    id: write
    attributes:
      label: 是否实际切换过模式
      options:
        - 只做了只读检测
        - 切换过一次并已切回
        - 切换过多次
        - 写入后出现异常
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: 结果
      description: 哪些模式可用、温度/风扇/噪音变化、是否有报错
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我知道这是未验证机型，写入风险由我承担
          required: true
        - label: 我已删除日志中的隐私信息
          required: true
        - label: 我没有上传官方安装包、官方 DLL 或反编译源码
          required: true
