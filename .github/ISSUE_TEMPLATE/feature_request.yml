name: Feature request
description: 新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先描述场景，不要直接跳到实现
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个功能不需要引入第三方 DLL、Python 运行时或联网
          required: true
        - label: 这个功能不要求绕过 UAC 或固件安全限制
          required: true
